{{define "strip"}}<div class="strip" role="img" aria-label="{{.Label}}">{{range .Cells}}<i class="{{.Class}}"{{if .Count}} title="{{.Count}} fired"{{end}}></i>{{end}}</div>{{end}}

{{define "noisebar"}}<div class="nbar" role="img" aria-label="{{.N.Firings}} firings: {{.N.Incidents}} made incidents, {{.N.Acted}} acted on"><i class="a" style="width:{{printf "%.1f" (percent .N.Acted .Top)}}%"></i><i class="p" style="width:{{printf "%.1f" (percent (sub .N.Incidents .N.Acted) .Top)}}%"></i><i class="f" style="width:{{printf "%.1f" (percent (sub .N.Firings .N.Incidents) .Top)}}%"></i></div>{{end}}
